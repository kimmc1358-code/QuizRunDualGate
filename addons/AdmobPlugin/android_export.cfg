; AdmobPlugin 의 파일 방식 내보내기 설정. 이 파일이 있으면 플러그인은 씬의
; Admob 노드를 찾지 않고 여기 값으로 APK 매니페스트의 광고 앱 ID 를 넣는다.
;
; 2026-10-06 프로덕션 출시(1.2.0)를 앞두고 is_real 을 켜고 [Release] 에 실제 앱 ID 를
; 넣었다. scripts/AdIds.gd 의 LIVE_APP_ID 와 같아야 하고, tools/check_ad_ids.gd 가
; 맞춰 본다.
;
; 알아 둘 것: 플러그인은 [Debug] 와 [Release] 를 빌드 종류로 고르지 않는다. is_real
; 하나만 보고, 켜져 있으면 디버그 빌드에도 [Release] 앱 ID 를 넣는다. 그래도 디버그
; 빌드에서 실제 광고는 안 나간다 — 무엇을 띄울지는 앱 ID 가 아니라 광고 단위가 정하고,
; 디버그 빌드는 AdIds 의 잠금 때문에 늘 Google 데모 단위를 쓴다. [Debug] 칸은
; is_real 을 다시 끄는 날을 위해 테스트 앱 ID 로 남겨 둔다.
;
; 이 파일을 지우면 플러그인은 조용히 씬에서 Admob 노드를 찾으러 간다 — 게임은
; 노드를 코드로 만들므로(Ads.gd) 씬에는 없고, 그러면 앱 ID 가 빠진 채 빌드되어
; 시작하자마자 죽는다.

