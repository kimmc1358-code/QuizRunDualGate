; AdmobPlugin 의 파일 방식 내보내기 설정. 이 파일이 있으면 플러그인은 씬의
; Admob 노드를 찾지 않고 여기 값으로 APK 매니페스트의 광고 앱 ID 를 넣는다.
;
; 출시 전까지는 두 칸 모두 Google 이 공개한 테스트 앱 ID 이고 is_real 은 false 다.
; 그래서 어떤 빌드도 실제 AdMob 앱 ID 를 달고 나가지 않는다. 실제 값은 출시할 때
; scripts/AdIds.gd 의 LIVE_APP_ID 와 함께 [Release] 에만 넣고 is_real 을 켠다.
; tools/check_ad_ids.gd 가 AdIds 의 잠금과 이 파일이 어긋나면 실패한다.
;
; 이 파일을 지우면 플러그인은 조용히 씬에서 Admob 노드를 찾으러 간다 — 게임은
; 노드를 코드로 만들므로(Ads.gd) 씬에는 없고, 그러면 앱 ID 가 빠진 채 빌드되어
; 시작하자마자 죽는다.

